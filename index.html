var NUM=new Intl.NumberFormat('es-MX');
function pct(a,b){return b>0?Math.round(a/b*100):0}
function short(s){
  return s.replace(/Cl[iÃ­]nica Equilibrio Total\s*/gi,'')
          .replace(/Cl[iÃ­]nica FSH\s*/gi,'FSH ')
          .replace(/Equilibrio total\s*/gi,'').trim();
}
function badge(v){var c=v>0?'g':v<0?'r':'y';return'<span class="bx '+c+'">'+(v>0?'+':'')+v+'</span>';}
function dot(v){var c=v>0?'g':v<0?'r':'y';return'<span class="dot '+c+'"></span>';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var DIAS_MES=30;
var ACCIONES={};
function openAccion(key){
  var info=ACCIONES[key];
  if(!info)return;
  document.getElementById('modalTitle').textContent=info.sede;
  document.getElementById('modalBody').textContent=info.accion?info.accion:'Sin notas registradas para esta sede.';
  document.getElementById('modalOverlay').className='modal-overlay show';
}
function closeAccion(){
  document.getElementById('modalOverlay').className='modal-overlay';
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-sede]');
  if(el){openAccion(el.getAttribute('data-sede'));}
});
var SEDES_26=['BALBUENA','MILPA ALTA','MIXQUIAHUALA','TLAHUAC','AJUSCO','MODERNA','SATELITE','VALLE DORADO','PACHUCA','CUAUTLA','QUERETARO','SAN JUAN DEL RIO','TEPEYAC','XOCHIMILCO'];
function normaliza(s){
  return s.toUpperCase().split('').map(function(ch){
    var c=ch.charCodeAt(0);
    if(c===193)return'A';
    if(c===201)return'E';
    if(c===205)return'I';
    if(c===211)return'O';
    if(c===218)return'U';
    return ch;
  }).join('');
}
function diasMesSede(sede){
  var n=normaliza(sede);
  for(var i=0;i<SEDES_26.length;i++){if(n.indexOf(SEDES_26[i])!==-1)return 26;}
  return 30;
}
function proySede(f){
  var ritmo=D.diaHoy>0?f.efectivas/D.diaHoy:0;
  return Math.round(ritmo*diasMesSede(f.sede));
}

function kCard(c,l,end,s,fmt,prefix){
  prefix=prefix||'';
  var zero=fmt==='mxn'?MXN.format(0):fmt==='pct'?'0%':'0';
  return'<div class="kpi '+c+'"><div class="kpi-lbl">'+l+'</div><div class="kpi-val cnt" data-target="'+end+'" data-fmt="'+fmt+'" data-prefix="'+prefix+'">'+prefix+zero+'</div>'+(s?'<div class="kpi-sub">'+s+'</div>':'')+'</div>';
}
function fmtCnt(v,fmt){
  if(fmt==='mxn')return MXN.format(v);
  if(fmt==='pct')return Math.round(v)+'%';
  return NUM.format(Math.round(v));
}
function animateCounters(){
  document.querySelectorAll('.cnt').forEach(function(el){
    var end=parseFloat(el.getAttribute('data-target'))||0;
    var fmt=el.getAttribute('data-fmt');
    var prefix=el.getAttribute('data-prefix')||'';
    var dur=1000,t0=null;
    function step(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1);
      var e=1-Math.pow(1-p,3);
      el.textContent=prefix+fmtCnt(end*e,fmt);
      if(p<1)requestAnimationFrame(step);
      else el.textContent=prefix+fmtCnt(end,fmt);
    }
    requestAnimationFrame(step);
  });
}
function animateBars(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.querySelectorAll('.cnt-bar').forEach(function(b){
        b.style.width=(b.getAttribute('data-w')||0)+'%';
      });
    });
  });
}
function calcProyeccion(tot,filas){
  var diasTrans=D.diaHoy||1;
  var ritmo=diasTrans>0?tot.efectivas/diasTrans:0;
  var proyeccion=(filas&&filas.length)?filas.reduce(function(s,f){return s+proySede(f);},0):Math.round(ritmo*DIAS_MES);
  return{proyeccion:proyeccion,ritmo:ritmo.toFixed(1),diasTrans:diasTrans};
}

function renderKpis(tot,el,proy){

    kCard('blue','LEADS TOTALES',tot.leads,'','num')+

    kCard('green','AVANCE',p,'efectivas vs meta','pct')+
    kCard('orange','GASTADO',tot.gastado,'','mxn');
  if(tot.deficit>0){
    html+=kCard('red','DEFICIT TOTAL',tot.deficit,'citas pendientes','num','-');
  }else{
    html+=kCard('green','DEFICIT TOTAL',Math.abs(tot.deficit),'al corriente','num',tot.deficit<0?'+':'');
  }
  if(proy){
    html+=kCard(proy.proyeccion>=tot.meta?'green':'orange','PROY. FIN DE MES',proy.proyeccion,'ritmo: '+proy.ritmo+'/dia Â· dia '+proy.diasTrans+'/'+DIAS_MES,'num');
  }
  el.innerHTML=html;
}

function renderRanking(filas,el){

  var arr=filas.map(function(f){return{nm:short(f.sede),p:pct(f.efectivas,f.meta)};});
  var byP=arr.slice().sort(function(a,b){return b.p-a.p;});
  var n=Math.min(3,byP.length);
  var top=byP.slice(0,n);
  var bottom=byP.slice(-n).reverse();
  function colorOf(p){return p>=100?'#6F9A5D':p>=75?'#C6922A':'#C0524A';}
  function item(a,i,cls){
    return'<div class="rank-item clickable" data-sede="'+esc(a.nm)+'" style="animation-delay:'+(.1+i*0.07)+'s"><div class="rank-num '+cls+'">'+(i+1)+'</div><div class="rank-name">'+a.nm+'</div><div class="rank-val" style="color:'+colorOf(a.p)+'">'+a.p+'%</div></div>';
  }
  el.innerHTML='<div class="rank-wrap">'+
    '<div class="rank-col"><h3>Top Desempeno</h3>'+top.map(function(a,i){return item(a,i,'top');}).join('')+'</div>'+
    '<div class="rank-col"><h3>Requieren Atencion</h3>'+bottom.map(function(a,i){return item(a,i,'bottom');}).join('')+'</div>'+
    '</div>';
}

    '<td style="white-space:nowrap"><span class="pb"><span class="pf" style="width:'+Math.min(avgAvance,100)+'%;background:'+totCol+'"></span></span> <span style="font-size:12px;color:'+totCol+'">'+avgAvance+'%</span></td>'+
    '<td class="tr">'+NUM.format(tot.efectivas)+'</td>'+
    '<td class="tr">'+NUM.format(tot.debemos)+'</td>'+
    '<td style="text-align:center">'+badge(totDiff)+'</td>'+
    '<td class="tr" style="color:'+totProyCol+'">'+NUM.format(totProy)+'</td>'+
    '<td class="tr">'+avgConv+'%</td>'+
    '<td class="tr">'+MXN.format(tot.leads>0?tot.gastado/tot.leads:0)+'</td>'+
    '<td class="tr">'+MXN.format(tot.efectivas>0?tot.gastado/tot.efectivas:0)+'</td>'+
    '<td class="tr">'+MXN.format(tot.gastado)+'</td>'+
    '</tr></tfoot>';
  var areaHeader=showArea?'<th>AREA</th>':'';
  el.innerHTML='<div class="sec">Detalle por Sede</div>'+
    '<div class="twrap"><table><thead><tr>'+
    '<th style="width:30px"></th>'+areaHeader+'<th>SEDE</th><th class="tr">META</th><th class="tr">LEADS</th>'+
    '<th style="min-width:130px">AVANCE PROM.</th>'+
    '<th class="tr">EFECTIVAS</th><th class="tr">DEBEMOS</th><th style="text-align:center">DEFICIT</th>'+
    '<th class="tr">PROY. FIN MES</th>'+
    '<th class="tr">CONV% PROM.</th><th class="tr">CPL</th><th class="tr">CAC</th><th class="tr">GASTADO</th>'+
    '</tr></thead><tbody>'+rows+'</tbody>'+tfoot+'</table></div>';
}

function renderProj(proj,semanas,dias,el){
  var max=Math.max.apply(null,semanas)||1;
  var bars=semanas.map(function(v,i){
    var w=Math.round(v/max*100);
    var lbl=dias&&dias[i]?dias[i]+' Jun':'D'+(i+1);
    return'<div class="wbar"><div class="wlbl">'+lbl+'</div>'+
      '<div class="wtrk"><div class="wfil cnt-bar" data-w="'+w+'" style="width:0%">'+(w>12?'<span class="wnum">'+v+'</span>':'')+
      '</div></div>'+(w<=12?'<div class="wext">'+v+'</div>':'')+
    '</div>';
  }).join('');
  var shdr='';
  semanas.forEach(function(_,i){
    var lbl=dias&&dias[i]?dias[i]+'/Jun':'D'+(i+1);
    shdr+='<th class="tr">'+lbl+'</th>';
  });
  var trows=proj.map(function(p){
    var s=Array.isArray(p.semanas)?p.semanas:[p.semanas];
    return'<tr><td style="width:30px"></td><td class="tnm">'+short(p.sede)+'</td>'+
      s.map(function(v){return'<td class="tr">'+(v||0)+'</td>';}).join('')+
      '<td class="tr" style="font-weight:700;color:#3F7A89">'+p.total+'</td></tr>';
  }).join('');
  var totalGen=semanas.reduce(function(s,v){return s+v;},0);
  var tfoot='<tfoot><tr>'+
    '<td style="width:30px"></td>'+
    '<td class="tnm" style="color:#3F7A89;font-size:11px;letter-spacing:1px">TOTAL POR DIA</td>'+
    semanas.map(function(v){return'<td class="tr" style="font-weight:700;color:#c9d1d9">'+v+'</td>';}).join('')+
    '<td class="tr" style="font-weight:700;color:#3F7A89">'+totalGen+'</td>'+
    '</tr></tfoot>';
  el.innerHTML='<div class="sec" style="margin-top:4px">Proyecciones Junio 2026 â€” Citas Efectivas</div>'+
    '<div>'+bars+'</div>'+
    '<div class="twrap" style="margin-top:16px"><table>'+
    '<thead><tr><th style="width:30px"></th><th>SEDE</th>'+shdr+'<th class="tr">TOTAL</th></tr></thead>'+
    '<tbody>'+trows+'</tbody>'+tfoot+'</table></div>';
}

function renderSection(id,data){
  var el=document.getElementById(id);
  var proy=calcProyeccion(data.tot,data.filas);
  var k=document.createElement('div'); k.className='kpis'; el.appendChild(k); renderKpis(data.tot,k,proy);
  var rk=document.createElement('div'); el.appendChild(rk); renderRanking(data.filas,rk);
  var a=document.createElement('div'); el.appendChild(a); renderAlertas(data.filas,a);
  var pr=document.createElement('div'); el.appendChild(pr); renderPromedios(data.filas,pr);
  var t=document.createElement('div'); el.appendChild(t); renderTable(data.filas,data.tot,t);
  var p=document.createElement('div'); el.appendChild(p); renderProj(data.proj,data.semanas,data.dias,p);
}
function go(id,btn){
  ['corp','franq','terz'].forEach(function(k){
    document.getElementById(k).className=k===id?'':'hidden';
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.className='tab'+(b===btn?' on':'');
  });
}
renderSection('corp',D.corp);
renderSection('franq',D.franq);
renderSection('terz',D.terz);
animateCounters();
animateBars();
</script>
</body>
</html>
