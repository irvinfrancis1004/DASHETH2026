function renderAlertas(filas,el){
  var crit=[],warn=[],ok=[];
  filas.forEach(function(f){
    var diff=f.efectivas-f.debemos, nm=short(f.sede);
    if(diff<=-4) crit.push({nm:nm,diff:diff,ef:f.efectivas,deb:f.debemos,conv:f.conv});
    else if(diff<0) warn.push({nm:nm,diff:diff,ef:f.efectivas,deb:f.debemos,conv:f.conv});
    else ok.push({nm:nm,diff:diff,ef:f.efectivas,deb:f.debemos});
  });
  crit.sort(function(a,b){return a.diff-b.diff});
  warn.sort(function(a,b){return a.diff-b.diff});
  var pills='<div class="alrt-pills">'+
    (crit.length?'<span class="pill r">'+crit.length+' CRITICO</span>':'')+
    (warn.length?'<span class="pill y">'+warn.length+' ATENCION</span>':'')+
    (ok.length?'<span class="pill g">'+ok.length+' EN META</span>':'')+
    '</div>';
  var cards='';
  crit.forEach(function(a){cards+='<div class="ac crit"><div class="ac-icon">&#128308;</div><div><div class="ac-sede">'+a.nm+'</div><div class="ac-msg">Lleva '+a.ef+' citas, deberia llevar '+a.deb+'.<br>Conversion: '+a.conv+'%</div><span class="ac-tag crit">DEFICIT '+a.diff+'</span></div></div>';});

  ok.forEach(function(a){cards+='<div class="ac ok"><div class="ac-icon">&#128994;</div><div><div class="ac-sede">'+a.nm+'</div><div class="ac-msg">'+a.ef+' citas efectivas'+(a.diff>0?' â€” supera la meta en +'+a.diff:' â€” exactamente en meta')+'</div><span class="ac-tag ok">'+(a.diff>0?'+'+a.diff+' SOBRE META':'EN META')+'</span></div></div>';});

  }).join('');
  var n=filas.length;
  var totP=pct(tot.efectivas,tot.meta),totCol=totP>=100?'#3fb950':totP>=75?'#d29922':'#f85149',totDiff=tot.efectivas-tot.debemos;
  var avgAvance=n>0?Math.round(filas.reduce(function(s,f){return s+pct(f.efectivas,f.meta);},0)/n):0;
  var avgConv=n>0?Math.round(filas.reduce(function(s,f){return s+f.conv;},0)/n):0;
  var tfoot='<tfoot><tr>'+
    '<td style="text-align:center">'+dot(totDiff)+'</td>'+
    '<td class="tnm" style="color:#58a6ff;font-size:11px;letter-spacing:1px">TOTALES / PROM.</td>'+
    '<td class="tr">'+NUM.format(tot.meta)+'</td>'+
    '<td class="tr">'+NUM.format(tot.leads)+'</td>'+
    '<td style="white-space:nowrap"><span class="pb"><span class="pf" style="width:'+Math.min(avgAvance,100)+'%;background:'+totCol+'"></span></span> <span style="font-size:12px;color:'+totCol+'">'+avgAvance+'%</span></td>'+
    '<td class="tr">'+NUM.format(tot.efectivas)+'</td>'+
    '<td class="tr">'+NUM.format(tot.debemos)+'</td>'+
    '<td style="text-align:center">'+badge(totDiff)+'</td>'+
    '<td class="tr">'+avgConv+'%</td>'+
    '<td class="tr">'+MXN.format(tot.leads>0?tot.gastado/tot.leads:0)+'</td>'+
    '<td class="tr">'+MXN.format(tot.efectivas>0?tot.gastado/tot.efectivas:0)+'</td>'+
    '<td class="tr">'+MXN.format(tot.gastado)+'</td>'+
    '</tr></tfoot>';
  el.innerHTML='<div class="sec">Detalle por Sede</div>'+
    '<div class="twrap"><table><thead><tr>'+
    '<th style="width:30px"></th><th>SEDE</th><th class="tr">META</th><th class="tr">LEADS</th>'+
    '<th style="min-width:130px">AVANCE PROM.</th>'+
    '<th class="tr">EFECTIVAS</th><th class="tr">DEBEMOS</th><th style="text-align:center">DEFICIT</th>'+
    '<th class="tr">CONV% PROM.</th><th class="tr">CPL</th><th class="tr">CAC</th><th class="tr">GASTADO</th>'+
    '</tr></thead><tbody>'+rows+'</tbody>'+tfoot+'</table></div>';
}

function renderProj(proj,semanas,dias,el){
  var max=Math.max.apply(null,semanas)||1;
  var bars=semanas.map(function(v,i){
    var w=Math.round(v/max*100);
    var lbl=dias&&dias[i]?dias[i]+' Jun':'D'+(i+1);
    return'<div class="wbar"><div class="wlbl">'+lbl+'</div>'+
      '<div class="wtrk"><div class="wfil" style="width:'+w+'%">'+(w>12?'<span class="wnum">'+v+'</span>':'')+
      '</div></div>'+(w<=12?'<div class="wext">'+v+'</div>':'')+
    '</div>';
  }).join('');
  var shdr='';
  semanas.forEach(function(_,i){
    var lbl=dias&&dias[i]?dias[i]+'/Jun':'D'+(i+1);
    shdr+='<th class="tr">'+lbl+'</th>';
  });
  var trows=proj.map(function(p){
    var s=Array.isArray(p.semanas)?p.semanas:[p.semanas];
    return'<tr><td style="width:30px"></td><td class="tnm">'+short(p.sede)+'</td>'+
      s.map(function(v){return'<td class="tr">'+(v||0)+'</td>';}).join('')+
      '<td class="tr" style="font-weight:700;color:#58a6ff">'+p.total+'</td></tr>';
  }).join('');
  var totalGen=semanas.reduce(function(s,v){return s+v;},0);
  var tfoot='<tfoot><tr>'+
    '<td style="width:30px"></td>'+
    '<td class="tnm" style="color:#58a6ff;font-size:11px;letter-spacing:1px">TOTAL POR DIA</td>'+
    semanas.map(function(v){return'<td class="tr" style="font-weight:700;color:#c9d1d9">'+v+'</td>';}).join('')+
    '<td class="tr" style="font-weight:700;color:#58a6ff">'+totalGen+'</td>'+
    '</tr></tfoot>';
  el.innerHTML='<div class="sec" style="margin-top:4px">Proyecciones Junio 2026 â€” Citas Efectivas</div>'+
    '<div>'+bars+'</div>'+
    '<div class="twrap" style="margin-top:16px"><table>'+
    '<thead><tr><th style="width:30px"></th><th>SEDE</th>'+shdr+'<th class="tr">TOTAL</th></tr></thead>'+
    '<tbody>'+trows+'</tbody>'+tfoot+'</table></div>';
}

function renderSection(id,data){
  var el=document.getElementById(id);
  var k=document.createElement('div'); k.className='kpis'; el.appendChild(k); renderKpis(data.tot,k);
  var a=document.createElement('div'); el.appendChild(a); renderAlertas(data.filas,a);
  var pr=document.createElement('div'); el.appendChild(pr); renderPromedios(data.filas,pr);
  var t=document.createElement('div'); el.appendChild(t); renderTable(data.filas,data.tot,t);
  var p=document.createElement('div'); el.appendChild(p); renderProj(data.proj,data.semanas,data.dias,p);
}
function go(id,btn){
  ['corp','franq','terz'].forEach(function(k){
    document.getElementById(k).className=k===id?'':'hidden';
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.className='tab'+(b===btn?' on':'');
  });
}
renderSection('corp',D.corp);
renderSection('franq',D.franq);
renderSection('terz',D.terz);
</script>
</body>
</html>
